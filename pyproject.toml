[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-agent"
version = "0.1.0"
description = "Personal agent that finds events and news for you and publishes them to your tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6",
    "feedparser>=6.0",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "httpx>=0.27",
    "icalendar>=6.0",
    "keyring>=25.0",
    "platformdirs>=4.0",
    "pydantic>=2.7",
    "recurring-ical-events>=3.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "import-linter>=2.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
agent = "personal_agent.cli:main"

[project.entry-points."personal_agent.content"]
events = "personal_agent.plugins.content.events.plugin:EventsPlugin"

[project.entry-points."personal_agent.outputs"]
markdown_digest = "personal_agent.plugins.outputs.markdown_digest:MarkdownDigestOutput"
google_calendar = "personal_agent.plugins.outputs.google_calendar:GoogleCalendarOutput"

[tool.hatch.build.targets.wheel]
packages = ["personal_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
exclude = ["*.md"]  # keep hand-aligned code samples in docs

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
packages = ["personal_agent"]
strict = true

[[tool.mypy.overrides]]
module = [
    "icalendar.*", "recurring_ical_events.*", "feedparser.*", "googleapiclient.*",
    "google_auth_oauthlib.*", "google.*", "keyring.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "personal_agent"

[[tool.importlinter.contracts]]
name = "Kernel never imports plugins"
type = "forbidden"
source_modules = ["personal_agent.kernel"]
forbidden_modules = ["personal_agent.plugins"]

[[tool.importlinter.contracts]]
name = "Content and output plugins are independent"
type = "independence"
modules = ["personal_agent.plugins.content", "personal_agent.plugins.outputs"]
